name: test

on:
  push:
  pull_request:

# 同一分支又推了新提交时，取消还在跑的旧运行，免得旧运行占着 Windows / macOS 机器
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # 浏览器卡死时整个任务最多跑 25 分钟（默认 6 小时）
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
        # GitHub 的 macOS 机器常排不上队，只留一个 macOS 任务
        exclude:
          - os: macos-latest
            node: 20
    defaults:
      run:
        # Windows 上也用 bash：test/*.test.js 靠 shell 展开（pwsh 不展开，Node 20 自己也不认 glob）
        shell: bash
    env:
      # 界面测试用全局 WebSocket：Node 22 自带，Node 20 要这个开关（不会往 stderr 打警告）
      NODE_OPTIONS: --experimental-websocket
      # 找不到浏览器时界面测试应当失败而不是跳过（test/ui.test.js 读这个变量）
      REQTREE_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 界面测试要量中文文字宽度；Ubuntu 镜像没有中文字体，会画成方块
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      # GitHub 的三种镜像都预装了 Chrome（Windows 还有 Edge）；找到的路径交给 test/ui.test.js
      # 三个系统都先用 Chrome（Ubuntu 上一直用它、一直通过）；Edge 只在没有 Chrome 时兜底
      - name: Locate browser
        run: |
          for p in \
            "C:/Program Files/Google/Chrome/Application/chrome.exe" \
            "C:/Program Files (x86)/Google/Chrome/Application/chrome.exe" \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/usr/bin/google-chrome" \
            "/usr/bin/google-chrome-stable" \
            "/usr/bin/chromium" \
            "/usr/bin/chromium-browser" \
            "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" \
            "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"; do
            if [ -f "$p" ]; then
              echo "REQTREE_BROWSER=$p" >> "$GITHUB_ENV"
              echo "browser: $p"
              exit 0
            fi
          done
          echo "::warning::no Chrome/Edge found"

      # --test-timeout 在多文件模式下也管整个文件（ui.test.js 本地就要 2–3 分钟），所以给 10 分钟；
      # 单个界面测试自己设了 60–90 秒。整步最多 15 分钟，超时算失败，下面两步照样跑
      - name: Test
        timeout-minutes: 15
        run: |
          set -o pipefail
          node --test --test-timeout=600000 --test-reporter=tap test/*.test.js 2>&1 | tee test-output.txt

      # 日志要登录才能看；失败的测试写成注释，公开可见
      - name: Annotate failures
        if: failure() || cancelled()
        run: node tools/ci-annotate.js test-output.txt

      - name: Upload screenshots
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.os }}-node${{ matrix.node }}
          path: test/out/*.png
          if-no-files-found: ignore
