# 打版本号标签（如 v1.0.0）时：跑测试 → 打包 vsix → 挂到 GitHub Releases；
# 仓库 Secrets 里有 VSCE_PAT / OVSX_PAT 时，同时发布到 VS Code 扩展市场 / Open VSX（没有就跳过）
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 装中文字体（界面测试要量中文宽度）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 测试
        env:
          REQTREE_BROWSER: /usr/bin/google-chrome
          REQTREE_REQUIRE_BROWSER: '1'
        run: node --test test/*.test.js
      - name: 版本号要和标签一致
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: 打包
        run: npx --yes @vscode/vsce@3 package --no-dependencies -o reqtree-${GITHUB_REF_NAME#v}.vsix
      - name: 挂到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: reqtree-*.vsix
          generate_release_notes: true
      - name: 发布到 VS Code 扩展市场
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --no-dependencies --packagePath reqtree-*.vsix -p "$VSCE_PAT"
      - name: 发布到 Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish reqtree-*.vsix -p "$OVSX_PAT"
