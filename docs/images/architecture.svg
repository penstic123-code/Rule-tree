<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>需求树是怎么工作的</title>
  <rect width="960" height="580" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>

  <!-- 列标题 -->
  <g font-size="15" font-weight="700" fill="#5b6472">
    <text x="95" y="38" text-anchor="middle">① 进来的</text>
    <text x="330" y="38" text-anchor="middle">② 后台整理</text>
    <text x="570" y="38" text-anchor="middle">③ 存在哪</text>
    <text x="815" y="38" text-anchor="middle">④ 送到谁手上</text>
  </g>

  <!-- ① 进来的 -->
  <g font-size="14" fill="#1f2328">
    <rect x="20" y="70" width="150" height="62" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="96" text-anchor="middle" font-weight="600">你说的话</text>
    <text x="95" y="117" text-anchor="middle" font-size="12" fill="#5b6472">"营业时间走 ShopHours"</text>

    <rect x="20" y="150" width="150" height="62" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="176" text-anchor="middle" font-weight="600">AI 改了哪些文件</text>
    <text x="95" y="197" text-anchor="middle" font-size="12" fill="#5b6472">shops/shop_door.gd</text>

    <rect x="20" y="230" width="150" height="62" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="256" text-anchor="middle" font-weight="600">项目里的代码</text>
    <text x="95" y="277" text-anchor="middle" font-size="12" fill="#5b6472">函数、类、谁调用谁</text>

    <rect x="20" y="310" width="150" height="62" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="336" text-anchor="middle" font-weight="600">记忆和文档</text>
    <text x="95" y="357" text-anchor="middle" font-size="12" fill="#5b6472">CLAUDE.md、设计文档</text>
  </g>

  <!-- ② 后台整理 -->
  <g font-size="14" fill="#1f2328">
    <rect x="245" y="70" width="170" height="92" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="96" text-anchor="middle" font-weight="700">记录员</text>
    <text x="330" y="117" text-anchor="middle" font-size="12" fill="#5b6472">每轮聊完，小模型在后台读</text>
    <text x="330" y="134" text-anchor="middle" font-size="12" fill="#5b6472">把长期要求挂到</text>
    <text x="330" y="151" text-anchor="middle" font-size="12" fill="#5b6472">管那些文件的需求下</text>

    <rect x="245" y="190" width="170" height="80" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="216" text-anchor="middle" font-weight="700">读代码</text>
    <text x="330" y="237" text-anchor="middle" font-size="12" fill="#5b6472">算出谁调用谁、名字在哪</text>
    <text x="330" y="254" text-anchor="middle" font-size="12" fill="#5b6472">帮着判断代码归哪个需求</text>

    <rect x="245" y="298" width="170" height="100" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="324" text-anchor="middle" font-weight="700">体检（你点了才跑）</text>
    <text x="330" y="345" text-anchor="middle" font-size="12" fill="#5b6472">合并重复、处理矛盾</text>
    <text x="330" y="362" text-anchor="middle" font-size="12" fill="#5b6472">清掉过时的、规则归位</text>
    <text x="330" y="379" text-anchor="middle" font-size="12" fill="#5b6472">结构长歪了重新整理，打分</text>
  </g>

  <!-- ③ 存在哪 -->
  <g font-size="14" fill="#1f2328">
    <rect x="480" y="70" width="180" height="210" rx="12" fill="#e9f7ef" stroke="#7cc49a" stroke-width="2"/>
    <text x="570" y="100" text-anchor="middle" font-weight="700" font-size="16">需求树.md</text>
    <text x="570" y="122" text-anchor="middle" font-size="12" fill="#5b6472">唯一的标准答案</text>
    <g font-size="12" fill="#1f2328">
      <text x="496" y="152">R3 店铺</text>
      <text x="508" y="172">· 店员只在店里出现</text>
      <text x="496" y="196">  R3.1 店门与营业时间</text>
      <text x="508" y="216">· 营业时间走</text>
      <text x="520" y="233">ShopHours</text>
      <text x="496" y="259">  &gt; 文档：店铺设计.md</text>
    </g>

    <rect x="480" y="300" width="180" height="98" rx="10" fill="#f4f5f7" stroke="#c4c9d1"/>
    <text x="570" y="326" text-anchor="middle" font-weight="600">.reqtree/</text>
    <text x="570" y="347" text-anchor="middle" font-size="12" fill="#5b6472">每次改动的记录（都能撤销）</text>
    <text x="570" y="365" text-anchor="middle" font-size="12" fill="#5b6472">代码地图、自动检查</text>
    <text x="570" y="383" text-anchor="middle" font-size="12" fill="#5b6472">体检报告</text>
  </g>

  <!-- ④ 送到谁手上 -->
  <g font-size="14" fill="#1f2328">
    <rect x="730" y="70" width="190" height="190" rx="12" fill="#f3eefe" stroke="#a98be0"/>
    <text x="825" y="98" text-anchor="middle" font-weight="700">AI</text>
    <text x="825" y="122" text-anchor="middle" font-size="12" fill="#5b6472">改 shop_door.gd 时</text>
    <text x="825" y="140" text-anchor="middle" font-size="12" fill="#5b6472">只读到这些：</text>
    <text x="745" y="166" font-size="12">✓ 店门与营业时间的规则</text>
    <text x="745" y="186" font-size="12">✓ 整个店铺的规则</text>
    <text x="745" y="206" font-size="12">✗ 别的模块的规则</text>
    <text x="745" y="236" font-size="12" fill="#5b6472">改完：按规则查一遍刚写的</text>
    <text x="745" y="252" font-size="12" fill="#5b6472">几行，可能违反就提醒</text>

    <rect x="730" y="290" width="190" height="80" rx="12" fill="#f3eefe" stroke="#a98be0"/>
    <text x="825" y="318" text-anchor="middle" font-weight="700">你</text>
    <text x="825" y="340" text-anchor="middle" font-size="12" fill="#5b6472">侧栏的树、导图、最近改动</text>
    <text x="825" y="357" text-anchor="middle" font-size="12" fill="#5b6472">体检报告和评分</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M170,101 L243,112"/>
    <path d="M170,181 L243,140"/>
    <path d="M170,261 L243,240"/>
    <path d="M170,341 L243,348"/>
    <path d="M415,116 L478,140"/>
    <path d="M415,230 L478,220"/>
    <path d="M415,348 L478,262"/>
    <path d="M660,150 L728,150"/>
    <path d="M660,250 L728,320"/>
  </g>
  <g font-size="12" fill="#5b6472">
    <text x="695" y="124" text-anchor="middle" font-size="11">按文件</text>
    <text x="695" y="139" text-anchor="middle" font-size="11">分好送出</text>
  </g>

  <!-- 底部说明 -->
  <g font-size="13" fill="#1f2328">
    <rect x="20" y="430" width="900" height="110" rx="12" fill="#fafbfc" stroke="#e1e4e8"/>
    <text x="40" y="460">关键在第 ④ 步：规则按文件分好，放进 Claude Code 自带的"按路径加载"机制里。AI 读写哪个文件，</text>
    <text x="40" y="482">Claude Code 才把管这个文件的规则交给它；新开对话、对话被压缩、派出子 agent，都照样送到。</text>
    <text x="40" y="504">AI 只读用得上的那几条，不占多余的上下文。第 ② 步让树一直保持整齐：新规则挂对地方，旧的、重复的、</text>
    <text x="40" y="526">打架的被理掉，结构长歪了重新分。</text>
  </g>
</svg>
