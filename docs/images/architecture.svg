<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>需求树是怎么工作的</title>
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>

  <!-- 列标题 -->
  <g font-size="15" font-weight="700" fill="#5b6472">
    <text x="95" y="38" text-anchor="middle">① 进来的</text>
    <text x="330" y="38" text-anchor="middle">② 后台整理</text>
    <text x="570" y="38" text-anchor="middle">③ 存在哪</text>
    <text x="815" y="38" text-anchor="middle">④ 送到谁手上</text>
  </g>

  <!-- ① 进来的 -->
  <g font-size="14" fill="#1f2328">
    <rect x="20" y="70" width="150" height="62" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="96" text-anchor="middle" font-weight="600">你说的话</text>
    <text x="95" y="117" text-anchor="middle" font-size="12" fill="#5b6472">"例子都要配图"</text>

    <rect x="20" y="150" width="150" height="62" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="176" text-anchor="middle" font-weight="600">AI 改了哪些文件</text>
    <text x="95" y="197" text-anchor="middle" font-size="12" fill="#5b6472">ch03.html</text>

    <rect x="20" y="230" width="150" height="62" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="256" text-anchor="middle" font-weight="600">项目里的代码</text>
    <text x="95" y="277" text-anchor="middle" font-size="12" fill="#5b6472">函数、类、引用关系</text>

    <rect x="20" y="310" width="150" height="62" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="336" text-anchor="middle" font-weight="600">记忆和文档</text>
    <text x="95" y="357" text-anchor="middle" font-size="12" fill="#5b6472">CLAUDE.md、规范文档</text>
  </g>

  <!-- ② 后台整理 -->
  <g font-size="14" fill="#1f2328">
    <rect x="245" y="90" width="170" height="80" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="118" text-anchor="middle" font-weight="700">记录员</text>
    <text x="330" y="139" text-anchor="middle" font-size="12" fill="#5b6472">每轮聊完，把长期要求</text>
    <text x="330" y="156" text-anchor="middle" font-size="12" fill="#5b6472">记到正在做的需求下</text>

    <rect x="245" y="220" width="170" height="70" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="248" text-anchor="middle" font-weight="700">代码地图</text>
    <text x="330" y="269" text-anchor="middle" font-size="12" fill="#5b6472">读代码，记下每块有什么</text>

    <rect x="245" y="320" width="170" height="70" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="348" text-anchor="middle" font-weight="700">体检（你点了才跑）</text>
    <text x="330" y="369" text-anchor="middle" font-size="12" fill="#5b6472">合并重复、处理矛盾</text>
  </g>

  <!-- ③ 存在哪 -->
  <g font-size="14" fill="#1f2328">
    <rect x="480" y="80" width="180" height="200" rx="12" fill="#e9f7ef" stroke="#7cc49a" stroke-width="2"/>
    <text x="570" y="110" text-anchor="middle" font-weight="700" font-size="16">需求树.md</text>
    <text x="570" y="132" text-anchor="middle" font-size="12" fill="#5b6472">唯一的标准答案</text>
    <g font-size="12" fill="#1f2328">
      <text x="498" y="162">C2 数据科学课</text>
      <text x="512" y="182">· 不引原话</text>
      <text x="498" y="206">  C2.3 第3章</text>
      <text x="512" y="226">· 例子都要配图</text>
      <text x="498" y="252">  &gt; 文档：章节表</text>
    </g>

    <rect x="480" y="300" width="180" height="90" rx="10" fill="#f4f5f7" stroke="#c4c9d1"/>
    <text x="570" y="326" text-anchor="middle" font-weight="600">.reqtree/</text>
    <text x="570" y="347" text-anchor="middle" font-size="12" fill="#5b6472">每次改动的记录</text>
    <text x="570" y="365" text-anchor="middle" font-size="12" fill="#5b6472">（所以都能撤销）</text>
  </g>

  <!-- ④ 送到谁手上 -->
  <g font-size="14" fill="#1f2328">
    <rect x="730" y="70" width="170" height="150" rx="12" fill="#f3eefe" stroke="#a98be0"/>
    <text x="815" y="98" text-anchor="middle" font-weight="700">AI</text>
    <text x="815" y="122" text-anchor="middle" font-size="12" fill="#5b6472">改到 ch03.html 时</text>
    <text x="815" y="140" text-anchor="middle" font-size="12" fill="#5b6472">只读到这些：</text>
    <text x="745" y="166" font-size="12">✓ 第 3 章的规则</text>
    <text x="745" y="186" font-size="12">✓ 这门课的规则和地图</text>
    <text x="745" y="206" font-size="12">✗ 别的课的规则</text>

    <rect x="730" y="250" width="170" height="80" rx="12" fill="#f3eefe" stroke="#a98be0"/>
    <text x="815" y="278" text-anchor="middle" font-weight="700">你</text>
    <text x="815" y="300" text-anchor="middle" font-size="12" fill="#5b6472">侧栏的树、导图、</text>
    <text x="815" y="317" text-anchor="middle" font-size="12" fill="#5b6472">最近改动、体检报告</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M170,101 L243,120"/>
    <path d="M170,181 L243,145"/>
    <path d="M170,261 L243,255"/>
    <path d="M170,341 L243,352"/>
    <path d="M415,130 L478,150"/>
    <path d="M415,255 L478,230"/>
    <path d="M415,355 L478,250"/>
    <path d="M660,140 L728,140"/>
    <path d="M660,240 L728,285"/>
  </g>
  <g font-size="12" fill="#5b6472">
    <text x="695" y="114" text-anchor="middle" font-size="11">按文件</text>
    <text x="695" y="129" text-anchor="middle" font-size="11">分好送出</text>
  </g>

  <!-- 底部说明 -->
  <g font-size="13" fill="#1f2328">
    <rect x="20" y="430" width="880" height="100" rx="12" fill="#fafbfc" stroke="#e1e4e8"/>
    <text x="40" y="460">关键在第 ④ 步：规则按文件分好放进 Claude Code 自带的"按路径加载"机制里。AI 读写哪个文件，</text>
    <text x="40" y="482">Claude Code 才把管这个文件的规则交给它。新开对话、对话被压缩、派出子 agent，这个机制照样生效，</text>
    <text x="40" y="504">所以 AI 不会忘；它也只读用得上的那几条，所以不浪费 token。</text>
  </g>
</svg>
