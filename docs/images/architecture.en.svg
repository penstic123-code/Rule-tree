<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>How RuleTree is put together</title>
  <rect width="960" height="570" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>
  

  <g font-size="15" font-weight="700" fill="#5b6472">
    <text x="95" y="38" text-anchor="middle">① Where it comes from</text>
    <text x="330" y="38" text-anchor="middle">② Who tends it</text>
    <text x="575" y="38" text-anchor="middle">③ Where it lives</text>
    <text x="850" y="38" text-anchor="middle">④ Who gets it</text>
  </g>

  
  <g font-size="14" fill="#1f2328">
    <rect x="20" y="70" width="150" height="70" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="97" text-anchor="middle" font-weight="600">What you tell the AI</text>
    <text x="95" y="119" text-anchor="middle" font-size="12" fill="#5b6472">requests meant to last</text>

    <rect x="20" y="205" width="150" height="70" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="232" text-anchor="middle" font-weight="600">You click Checkup</text>
    <text x="95" y="254" text-anchor="middle" font-size="12" fill="#5b6472">run when you choose</text>

    <rect x="20" y="333" width="150" height="70" rx="10" fill="#eef4ff" stroke="#9db8e8"/>
    <text x="95" y="360" text-anchor="middle" font-weight="600">Who edited a rule file</text>
    <text x="95" y="382" text-anchor="middle" font-size="12" fill="#5b6472">you, AI, Checkup, others</text>
  </g>

  
  <g font-size="14" fill="#1f2328">
    <rect x="245" y="70" width="170" height="92" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="96" text-anchor="middle" font-weight="700">The working AI</text>
    <text x="330" y="117" text-anchor="middle" font-size="12" fill="#5b6472">Follows the guide, writes</text>
    <text x="330" y="134" text-anchor="middle" font-size="12" fill="#5b6472">the request into the</text>
    <text x="330" y="151" text-anchor="middle" font-size="12" fill="#5b6472">matching requirement file</text>

    <rect x="245" y="190" width="170" height="100" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="216" text-anchor="middle" font-weight="700">Checkup</text>
    <text x="330" y="237" text-anchor="middle" font-size="12" fill="#5b6472">Code checks reach and scope,</text>
    <text x="330" y="254" text-anchor="middle" font-size="12" fill="#5b6472">then a model finds repeats,</text>
    <text x="330" y="271" text-anchor="middle" font-size="12" fill="#5b6472">clashes and stale rules</text>

    <rect x="245" y="318" width="170" height="100" rx="10" fill="#fff6e5" stroke="#e5b866"/>
    <text x="330" y="344" text-anchor="middle" font-weight="700">Hook (background)</text>
    <text x="330" y="365" text-anchor="middle" font-size="12" fill="#5b6472">On a rule-file change,</text>
    <text x="330" y="382" text-anchor="middle" font-size="12" fill="#5b6472">saves the before and after,</text>
    <text x="330" y="399" text-anchor="middle" font-size="12" fill="#5b6472">and notes where the AI works</text>
  </g>

  
  <g font-size="14" fill="#1f2328">
    <rect x="470" y="70" width="210" height="262" rx="12" fill="#e9f7ef" stroke="#7cc49a" stroke-width="2"/>
    <text x="575" y="98" text-anchor="middle" font-weight="700" font-size="16">Rules folder</text>
    <text x="575" y="118" text-anchor="middle" font-size="12" fill="#5b6472">.claude/rules/ruletree/</text>
    <text x="575" y="136" text-anchor="middle" font-size="12" fill="#5b6472">one file per requirement</text>
    <g font-size="13">
      <text x="486" y="170" font-weight="600">_root.md</text>
      <text x="486" y="187" font-size="12" fill="#5b6472">rules for the whole project</text>
      <text x="486" y="212" font-weight="600">Req. A</text>
      <text x="565" y="212" font-size="12" fill="#5b6472">covers a/**</text>
      <text x="504" y="236" font-weight="600">Req. A.1</text>
      <text x="580" y="236" font-size="12" fill="#5b6472">covers part of a/</text>
      <text x="486" y="261" font-weight="600">Req. B</text>
      <text x="565" y="261" font-size="12" fill="#5b6472">covers b/**</text>
      <text x="486" y="293" font-weight="600">_guide.md</text>
      <text x="486" y="310" font-size="12" fill="#5b6472">guide: how to read and write</text>
    </g>

    <rect x="470" y="358" width="210" height="82" rx="12" fill="#f4f5f7" stroke="#c4c9d2"/>
    <text x="575" y="384" text-anchor="middle" font-weight="700">.ruletree/ folder</text>
    <text x="575" y="406" text-anchor="middle" font-size="12" fill="#5b6472">every change, before and after</text>
    <text x="575" y="423" text-anchor="middle" font-size="12" fill="#5b6472">AI activity, rule sizes loaded</text>
  </g>

  
  <g font-size="14" fill="#1f2328">
    <rect x="760" y="70" width="180" height="232" rx="12" fill="#f1ecff" stroke="#b5a3ea"/>
    <text x="850" y="98" text-anchor="middle" font-weight="700">The AI</text>
    <text x="850" y="122" text-anchor="middle" font-size="12" fill="#5b6472">Editing a file in a/ brings only:</text>
    <text x="780" y="154">✓ project-wide rules</text>
    <text x="780" y="178">✓ Req. A’s rules</text>
    <text x="780" y="202">✗ Req. B’s: not sent</text>
    <text x="850" y="240" text-anchor="middle" font-size="12" fill="#5b6472">New chat, compacted chat,</text>
    <text x="850" y="257" text-anchor="middle" font-size="12" fill="#5b6472">sub-agent: all still get them</text>

    <rect x="760" y="330" width="180" height="110" rx="12" fill="#f1ecff" stroke="#b5a3ea"/>
    <text x="850" y="358" text-anchor="middle" font-weight="700">You</text>
    <text x="850" y="382" text-anchor="middle" font-size="12" fill="#5b6472">See the tree and map</text>
    <text x="850" y="399" text-anchor="middle" font-size="12" fill="#5b6472">See who changed which rule</text>
    <text x="850" y="416" text-anchor="middle" font-size="12" fill="#5b6472">Undo in one click</text>
  </g>

  
  <g stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M170,105 L243,105"/>
    <path d="M415,116 L468,150"/>
    <path d="M170,240 L243,240"/>
    <path d="M415,240 L468,240"/>
    <path d="M170,368 L243,368"/>
    <path d="M415,380 L468,395"/>
    <path d="M680,186 L758,186"/>
    <path d="M680,300 L758,350"/>
    <path d="M680,400 L758,400"/>
  </g>
  <g font-size="12" fill="#5b6472" text-anchor="middle">
    <text x="719" y="158">File edited</text>
    <text x="719" y="174">picks rules</text>
  </g>

  <rect x="20" y="462" width="920" height="92" rx="12" fill="#f8f9fb" stroke="#d6dae1"/>
  <g font-size="13" fill="#1f2328">
    <text x="40" y="488">Whichever file the AI reads or edits, Claude Code hands it the rules that cover that file. This is built into Claude Code:</text>
    <text x="40" y="508">a rule file lists the files it covers and loads only when those files are touched, so delivery does not depend on the AI’s memory.</text>
    <text x="40" y="528">The requirement tree is this folder. The working AI keeps it up to date, every change is logged before and after, and you can undo it.</text>
  </g>
</svg>
